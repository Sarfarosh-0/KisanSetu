name: KisanSetu CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vite production build & server bundle
        run: npm run build

  backend-test:
    name: Backend Lint & E2E Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Bytecode compilation check
        run: |
          python -m py_compile backend/main.py backend/models.py backend/schemas.py backend/auth.py backend/ml_engine.py backend/route_optimizer.py backend/seed_data.py

      - name: Start FastAPI Backend Server
        working-directory: backend
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          # Wait for server readiness
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "FastAPI server ready on port 8000"
              break
            fi
            sleep 1
          done

      - name: Run Auth & JWT Security E2E Test Suite
        run: python backend/test_auth_flow.py
